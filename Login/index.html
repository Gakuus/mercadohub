<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesion - MercadoHub</title>
  <link rel="stylesheet" href="../auth/assets/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <h1>Mercado<span>Hub</span></h1>
        <p>Inicia sesion para continuar</p>
      </div>

      <div id="auth-alert" class="auth-alert" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Correo electronico</label>
          <div class="input-wrapper">
            <input type="email" id="email" name="email" placeholder="tu@correo.com" required autocomplete="email">
            <span class="input-icon">&#9993;</span>
          </div>
          <div class="field-error" id="email-error">Correo electronico invalido.</div>
        </div>

        <div class="form-group">
          <label for="nombre_usuario">Nombre de usuario</label>
          <div class="input-wrapper">
            <input type="text" id="nombre_usuario" name="nombre_usuario" placeholder="Tu usuario" required autocomplete="username">
            <span class="input-icon">&#128100;</span>
          </div>
          <div class="field-error" id="username-error">El usuario debe tener al menos 3 caracteres.</div>
        </div>

        <div class="form-group">
          <label for="contrasena">Contrasena</label>
          <div class="input-wrapper">
            <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-password" aria-label="Mostrar contrasena" data-target="contrasena">&#128065;</button>
          </div>
          <div class="field-error" id="password-error">La contrasena es obligatoria.</div>
        </div>

        <button type="submit" class="btn-submit" id="login-btn">
          <span class="spinner-btn"></span>
          <span class="btn-text">Iniciar Sesion</span>
        </button>
      </form>

      <div class="auth-footer">
        ¿No tienes una cuenta? <a href="../Register/index.html">Crear cuenta</a>
      </div>
    </div>
  </div>

  <script>window.BASE_URL = '';</script>
  <script src="script.js"></script>
</body>
</html>
